auth:
  environment: development
  providers:
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}

integrations:
  github:
    - host: github.com
      token: ${GITHUB_TOKEN}
  
  # for accessing git repositories in Azure DevOps. credential type uses a PAT
  # do NOT use the credential keyword described in the docs: https://backstage.io/docs/integrations/azure/locations/
  azure:
    - host: dev.azure.com
      organizations:
        - idexperts
      token: ${AZURE_TOKEN}

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, User, Group, Template, Domain]

  locations:
    
    - type: url
      target: https://github.com/riskive/backstage/blob/master/data/roles.yaml
      rules:
        - allow: [Group]

    - type: url
      target: https://github.com/riskive/backstage/blob/master/data/teams.yaml
      rules:
        - allow: [Group]
        
    - type: url
      target: https://github.com/riskive/backstage/blob/master/data/users.yaml
      rules:
        - allow: [User]

    - type: file
      target: ../../data/pillars.yaml
      rules:
        - allow: [User]
        
    - type: url
      target: https://github.com/riskive/backstage/blob/master/data/domains.yaml
      rules:
        - allow: [Domain]

    # backstage
    - type: url
      target: https://github.com/riskive/backstage/blob/master/catalog-info.yaml
      rules:
        - allow: [Component, API, Group, System]

    # backstage golden paths
    - type: url
      target: https://github.com/riskive/backstage-docs/blob/master/goldenpath-creating_goldenpaths/catalog-info.yaml
      rules:
        - allow: [Component]
    - type: url
      target: https://github.com/riskive/backstage-docs/blob/master/goldenpath-add_documentation/catalog-info.yaml
      rules:
        - allow: [Component]

qeta:
  allowAnonymous: false
  allowMetadataInput: true
  allowGlobalEdits: false
  entities:
    kinds: ['System']
    max: 3
  tags:
    allowCreation: true
    max: 5
  moderators:
    - group:default/developer-portal-qa-moderators
  storage:
    type: database
    folder: /tmp/qeta-attachments
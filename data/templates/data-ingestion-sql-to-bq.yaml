apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: data-ingestion-sql-to-bq
  title: Ingest data from the an RDS instance to BigQuery
  description: |
    You want to ingest data from a RDS (Postgres, MySql, etc) instance to BigQuery.
  annotations:
    backstage.io/time-saved: PT4H

spec:
  owner: user:default/sebasaave
  type: Data Engineering
  parameters:
    - title: Basic details
      required:
        - name
        - schedule
        - pillar
        - slackAlertChannel
      properties:
        
        name:
          title: Ingestion name
          type: string
          description: Name your ingestion so it can be easily identified

        schedule:
          title: Ingestion schedule
          type: string
          description: |
            CRON expression for the schedule. You can use `https://crontab.guru/` to aid you.

        slackAlertChannel:
          title: Slack channel to notify
          type: string
          description: Slack channel to send alerts to in case of failure
          enum:
            - BI_CHANNEL
            - DS_CHANNEL
            - AS_CHANNEL
            - DIS_CHANNEL
            - DE_CHANNEL
            - DE_HEALTH_CHANNEL
          enumNames:
            - '#t-bi-team'
            - '#t-data-science-health-prod'
            - '#t-pillar-asm'
            - '#t-disruption'
            - '#t-data-engineering'
            - '#t-data-health-prod'

        pillar:
          title: Pillar
          type: string
          description: Pillar that the ingestion belongs to
          ui:field: ExtendedEntityPicker
          ui:options:
            showPillarOnly: true
            allowArbitraryValues: false
            catalogFilter:
              spec.type: pillar
              kind: Component
    
    - title: Source details
      required:
        - sourceRDSTable
      properties:
        sourceRDSTable:
          title: Primary table
          description: The primary table to be ingested, for example entity, enterprise, etc. You will add subtables (i.e. entity_domain) later if needed
          type: object
          ui:field: TablePicker
          ui:options:
            allowArbitraryValues: false
            allowedInstances:
              - resource:default/platformdb-prod-b
              - resource:default/prod-cs-takedown-api-02
              - resource:default/prod-cs-ma-api
              - resource:default/managed-services-qa

    - title: Extraction and load details
      required:
        - query
        - ddl
        - bqSchema
        - bqTable
        - mode
      properties:

        query:
          title: Extraction query
          type: string
          ui:widget: textarea
          description: |
            Query used for extracting data from the source RDS table.
            #### Keep in mind your query will be called for a specific time range, there it has to contain {start_date} and {end_date} place holders, for example:
            ```sql
            select id, name, create_at
            from database_name.table
            where created_at >= '{start_date}' and created_at <= '{end_date}'
            ```
            #### **Also include in your query**: 
            1. Add the database in the `from` statement
            1. Include single quotes around {start_date} and {end_date}
        ddl:
          title: Target BigQuery table DDL
          type: string
          ui:widget: textarea
          description: |
            Provide the DDL for the target BigQuery table.
            This will be ran by the data engineer team manually before the ingestion.
        
        bqSchema:
          title: Target BigQuery Schema
          type: string
          ui:widget: text
          description: |
            BigQuery schema (aka dataset) where target table will be located.
            For example `alerts` or `entities` (not the project nor the table).

        bqTable:
          title: Target BigQuery Table
          type: string
          ui:widget: text
          description: |
            Name of the target BigQuery table where data will be loaded.
            For example, `entity_domain` or `entity_domain_history`.

        mode:
          title: Mode
          type: string
          description: Mode to add to BQ
          enum:
            - overwrite
            - append
            - upsert
          enumNames:
            - 'Overwrite'
            - 'Append'
            - 'Upsert'

    - title: Pull Request Details
      required:
        - jiraTicket
      properties:
        jiraTicket:
          title: JIRA Ticket URL
          type: string
          ui:widget: text
          description: |
            Ticket to be used in the PR description.
            It has to be the full URL, for example `https://zerofox.atlassian.net/browse/DE-1234`.

        additionalNotes:
          title: Additional Notes
          type: string
          description: Any additional notes or reminders to include in the PR
          ui:widget: textarea

  steps:
    - id: current-user
      name: Get current user
      action: zf:user:get
    
    - id: workspace
      name: Prepare workspace
      action: zf:workspacePath
    
    - id: fetch-pillar
      name: Get pillar
      action: zf:entity:get
      input:
        entityRef: ${{ parameters.pillar }}

    - id: format-names
      name: Format ingestion names
      action: zf:dataIngest:formatIngestName
      input:
        ingestionName: ${{ parameters.name }}
        sourceTable: ${{ parameters.sourceRDSTable }}

    - id: clone-repo
      name: Clone target repository
      action: zf:execute
      input:
        command: git 
        args: clone git@github.com:riskive/airflow.git ${{ steps["workspace"].output.path }}

    # note, this won't be needed when the airflow PR is merged (we will have the template at master)
    - id: checkout-branch
      name: Checkout specific branch
      action: zf:execute
      input:
        command: git 
        args: -C ${{ steps["workspace"].output.path }} checkout feat/monolith-ingestion-dag-template

    - id: write-code
      name: Generate code for ingestion
      action: zf:dataIngest:createDagFolderFromTemplate
      input:
        basePath: ${{ steps["workspace"].output.path }}/dags/pipelines 
        ingestionName: ${{ parameters.name }}
        snakeCaseInstanceName: ${{ steps["format-names"].output.snakeCaseInstanceName }}
        snakeCaseIngestionName: ${{ steps["format-names"].output.snakeCaseIngestionName }}
        snakeCaseTaskName: ${{ steps["format-names"].output.snakeCaseTaskName }}
        camelCaseTaskName: ${{ steps["format-names"].output.camelCaseTaskName }}
        owner: ${{ steps["fetch-pillar"].output.entity.metadata.annotations["zerofox.com/pillar"] }}
        scheduleInterval: ${{ parameters.schedule }}
        slackAlertChannel: ${{ parameters.slackAlertChannel }}
        bqTable: ${{ parameters.bqTable }}
        bqSchema: ${{ parameters.bqSchema }}
        ddl: ${{ parameters.ddl }}
        sql: ${{ parameters.query }}
        mode: ${{ parameters.mode }}
        sourceTable: ${{ parameters.sourceRDSTable }}
    
    - id: generate-pullrequest-texts
      name: Generate pull request texts
      action: zf:generatePRTexts:newIngestion
      input:
        githubAuthor: ${{ steps["current-user"].output.githubUser }}
        jiraTicket: ${{ parameters.jiraTicket }}
        ingestionName: ${{ steps["format-names"].output.snakeCaseIngestionName }}
        additionalNotes: ${{ parameters.additionalNotes }}

    - id: generate-branch-name
      name: Generate branch name
      action: zf:util:randomBranchName
    
    - id: submit-pr
      name: Submit pull request
      action: zf:github:pull-request
      input:
        repoUrl: github.com?repo=airflow&owner=riskive
        title: Create sql to bq ingestion ${{ steps["format-names"].output.snakeCaseInstanceName }}.${{ steps["format-names"].output.snakeCaseDatabaseName }}.${{ steps["format-names"].output.snakeCaseSchemaName }}.${{ steps["format-names"].output.snakeCaseIngestionName }}
        description: ${{ steps["generate-pullrequest-texts"].output.description }}
        branchName: ${{ steps["generate-branch-name"].output.branchName }}
        commitMessage: ${{ steps["generate-pullrequest-texts"].output.commitMessage }}

  output:
    links:
      - title: Pull Request
        icon: catalog
        url: ${{ steps["submit-pr"].output.remoteUrl }}

    text:
      - title: Next steps
        content: |
          ### Review the PR
          Review the generated PR
          ### Test the DAG
          Test the DAG in the Airflow QA - STAG environments
          ### Merge the PR
          Ask for a review and merge the PR

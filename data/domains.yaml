apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: domain-protection
  title: Domain Protection
  description: Everything related to domain protection such as domain scan, phishing detection, etc.
spec:
  owner: domainowner
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: data-collection
  title: Data Collection
  description: Everything related to data collection from various datasources such as facebook, twitter, etc.
spec:
  owner: domainowner
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: enrichment
  title: Enrichment
  description: Everything related to enrichment of collected data such as OCR analysis, object detection, etc.
spec:
  owner: domainowner
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: alerting
  title: Alerting
  description: Everything related to alerting such as entities, enterprises, alerts, policies, etc.
spec:
  owner: domainowner
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: cti
  title: CTI
  description: Everything related to cyber threat intelligence.
spec:
  owner: domainowner
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: disruption
  title: Disruption
  description: Everything related to remediating alerts such as domain takedown, etc.
  annotations:
    grafana/tag-selector: disruption
spec:
  owner: domainowner
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: core-infra
  title: Core Infra
  description: Everything needed to support services running such as Nomad, Consul, Vault, etc.
  annotations:
    grafana/tag-selector: core-infra
spec:
  owner: domainowner

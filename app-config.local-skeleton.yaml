auth:
  environment: development
  providers:
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}

integrations:
  github:
    - host: github.com
      token: ${GITHUB_ACCESS_TOKEN}

catalog:
  locations:

    - type: file
      target: ../../local/user-groups.yaml
      rules:
        - allow: [Group]

    - type: file
      target: ../../local/users.yaml
      rules:
        - allow: [User]
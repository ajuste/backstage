kind: pipeline
type: docker
name: terra

steps:
  - name: fmt
    pull: if-not-exists
    image: hashicorp/terraform:1.8.5
    commands:
      - apk add -U make
      - make -C .terra/ check-fmt

  - name: plan
    pull: if-not-exists
    image: hashicorp/terraform:1.8.5
    environment:
      AWS_REGION: us-west-2
      AWS_ACCESS_KEY_ID:
        from_secret: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        from_secret: AWS_SECRET_ACCESS_KEY
      SSH_PRIVATE_KEY:
        from_secret: SSH_PRIVATE_KEY
    commands:
      - apk add -U make openssh-client jq zip
      - mkdir ~/.ssh && echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 0600 ~/.ssh/id_ed25519
      - ssh-keyscan -H github.com >> ~/.ssh/known_hosts
      - make -C .terra/ init
      - make -C .terra/ validate
      - make -C .terra/ plan
---
kind: pipeline
type: docker
name: test

steps:
  - name: build
    pull: if-not-exists
    image: node:18-bullseye-slim
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends python3 build-essential procps make python3-pip git
      - yarn config set python /usr/bin/python3
      - yarn install
      - yarn tsc
      - yarn test
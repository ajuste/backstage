---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: standard-doc-generate-for-service
  title: Generate documentation for a service
  description: |
    You have a repo that hosts a service and want to generate standard documentation.
  annotations:
    backstage.io/time-saved: PT30M
spec:
  owner: user:default/ajuste
  type: standard documentation
  parameters:
    - title: Basic information
      required:
        - service
      properties:

        service:
          title: Service
          description: |
            Service that you want to generate documentation for.
          type: string
          ui:field: ExtendedEntityPicker
          ui:options:
            tryShowDisplayName: true
            showRepo: true
            allowArbitraryValues: false
            catalogFilter:
              kind: System
              metadata.annotations.github.com/project-slug:
                exists: true
            
        overwrite_all_docs:
          title: Overwrite all docs
          type: boolean
          ui:help: |
            Check this option to overwrite every doc with default ones.

  steps:
    
    - id: current-user
      name: Get current user
      action: zf:user:get
    
    - id: workspace
      name: Prepare worksapce
      action: zf:workspacePath
    
    - id: fetch-entity
      name: Get entity
      action: zf:entity:get
      input:
        entityRef: ${{ parameters.service }}
    
    - id: clone-repo
      name: Clone target repository
      action: zf:execute
      input:
        command: git
        args: clone git@github.com:${{ steps["fetch-entity"].output.entity.metadata.annotations["github.com/project-slug"] }}.git ${{ steps["workspace"].output.path }}

    - id: run-backstage-zf-cli-args
      name: Generating arguments for backstage-zf-cli
      action: zf:utils:if
      input:
        condition: ${{ parameters.overwrite_all_docs }}
        returnOnTrue: service generate_std_docs --overwrite=1
        returnOnFalse: service generate_std_docs --overwrite=1
    
    - id: run-backstage-zf-cli
      name: Updating repository
      action: zf:execute
      input:
        command: ~/go/bin/backstage-zf-cli
        args: ${{ steps["run-backstage-zf-cli-args"].output.return }}
        basePath: ${{ steps["workspace"].output.path }}
    
    - id: generate-branch-name
      name: Generate branch name
      action: zf:util:randomBranchName
    
    - id: create-jira-issue
      name: Create JIRA Issue
      action: zf:jira:addNewIssue
      input:
        projectKey: ZFE
        summary: |
          Generate standard documentation for ${{ steps["fetch-entity"].output.entity.metadata.annotations["github.com/project-slug"] }}
        description: 'Generate for a service using the developer portal.'
        issueType: 10001
    
    - id: generate-pullrequest-texts
      name: Generate pull request texts
      action: zf:generatePRTexts:generateStandardDocs
      input:
        githubAuthor: ${{ steps["current-user"].output.githubUser }}
        jiraTicket: ${{ steps["create-jira-issue"].output.url }}
    
    - id: submit-pr
      name: Submit pull request
      action: publish:github:pull-request
      input:
        repoUrl: ${{ steps["fetch-entity"].output.entity | entitySlugToRepoUrl }}
        title: 'Standard documentation generation'
        description: ${{ steps["generate-pullrequest-texts"].output.description }}
        branchName: ${{ steps["generate-branch-name"].output.branchName }}
        commitMessage: ${{ steps["generate-pullrequest-texts"].output.commitMessage }}

  output:
    links:
      - title: Pull request
        icon: catalog
        url: ${{ steps["submit-pr"].output.remoteUrl }}
      - title: JIRA issue
        url: ${{ steps["create-jira-issue"].output.url }}

    text:
      - title: Next steps
        content: |
          ### 1. Merge the pull request
          A PR has been created; you can check it by clicking on the Pull Request tab. Once it is merged, the developer portal will automatically pick the documentation.
          Keep in mind you can check the changes in the PR and modify as needed.
          ### 2. A Jira ticket has been created.
          As part of tracking your work, please close the issue once you are finished. You can see in associated ticket on the JIRA issue tab.
          


---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: onboard-library-repo
  title: Onboard library repository
  description: |
    You have a repo that hosts a library.
    This golden path will help you onboard your service to the developer portal.
  annotations:
    backstage.io/time-saved: PT30M
spec:
  owner: user:default/ajuste
  type: devportal onboarding
  parameters:
    - title: Basic information
      required:
        - repoUrl
        - pillar
        - readme_description
      properties:
        repoUrl:
          title: Repository Location
          type: string
          description: Enter the name of the repository (i.e. rule-engine)
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            allowedOwners:
              - riskive

        pillar:
          title: Pillar
          type: string
          description: Pillar that your repo belongs to
          ui:field: ExtendedEntityPicker
          ui:options:
            showPillarOnly: true
            allowArbitraryValues: false
            catalogFilter:
              spec.type: pillar
              kind: Component

        readme_description:
          title: Readme description
          type: string
          description: Write a small description so everyone knows what this library is for

  steps:
    
    - id: current-user
      name: Get current user
      action: zf:user:get
    
    - id: workspace
      name: Prepare workspace
      action: zf:workspacePath
    
    - id: fetch-pillar
      name: Get pillar
      action: zf:entity:get
      input:
        entityRef: ${{ parameters.pillar }}
    
    - id: clone-repo
      name: Clone target repository
      action: zf:execute
      input:
        command: git
        args: clone git@${{ parameters.repoUrl | parseRepoUrl | pick('host') }}:${{ parameters.repoUrl | projectSlug }}.git ${{ steps["workspace"].output.path }}
    
    - id: run-backstage-zf-cli
      name: Updating local repository
      action: zf:execute
      input:
        command: ~/go/bin/backstage-zf-cli
        args: library enroll --name=${{ parameters.repoUrl | parseRepoUrl | pick('repo') }} --pillar="${{ steps["fetch-pillar"].output.entity.metadata.annotations["zerofox.com/pillar"] }}" --readme_description="${{ parameters.readme_description }}"
        basePath: ${{ steps["workspace"].output.path }}
    
    - id: generate-branch-name
      name: Generate branch name
      action: zf:util:randomBranchName
    
    - id: create-jira-issue
      name: Create JIRA Issue
      action: zf:jira:addNewIssue
      input:
        projectKey: ZFE
        summary: 'Onboarding library repo into the developer portal'
        description: 'Onboarding library repo into the developer portal'
        issueType: 10001
    
    - id: generate-pullrequest-texts
      name: Generate pull request texts
      action: zf:generatePRTexts:libraryOnBoarding
      input:
        githubAuthor: ${{ steps["current-user"].output.githubUser }}
        jiraTicket: ${{ steps["create-jira-issue"].output.url }}
    
    - id: submit-pr
      name: Submit pull request
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        title: 'Devportal onboarding'
        description: ${{ steps["generate-pullrequest-texts"].output.description }}
        branchName: ${{ steps["generate-branch-name"].output.branchName }}
        commitMessage: ${{ steps["generate-pullrequest-texts"].output.commitMessage }}

  output:
    links:
      - title: Pull request
        icon: catalog
        url: ${{ steps["submit-pr"].output.remoteUrl }}
      - title: JIRA issue
        url: ${{ steps["create-jira-issue"].output.url }}

    text:
      - title: Next steps
        content: |
          ### 1. Merge onboarding pull request
          A PR has been created; you can check it by clicking on the Pull Request tab. Once it is merged, the developer portal will automatically pick the repository and add it to the catalog.
          ### 2. A Jira ticket has been created.
          As part of tracking your work, please close the issue once you are finished. You can see in associated ticket on the JIRA issue tab.
          
